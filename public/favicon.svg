<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Orbit rings -->
  <ellipse cx="50" cy="50" rx="42" ry="24" stroke="#00D2FF" stroke-width="3" stroke-dasharray="4 2" transform="rotate(-25 50 50)" opacity="0.8"/>
  <ellipse cx="50" cy="50" rx="44" ry="18" stroke="#10B981" stroke-width="2.5" transform="rotate(35 50 50)" opacity="0.7"/>
  <!-- Central Circle -->
  <circle cx="50" cy="50" r="32" fill="#0A1628" stroke="url(#grad1)" stroke-width="3.5"/>
  <!-- Pin / Satellite Icon -->
  <circle cx="78" cy="30" r="5" fill="#00D2FF" />
  <!-- Text CTM -->
  <text x="50" y="56" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CTM</text>
  <text x="50" y="68" font-family="sans-serif" font-size="8" font-weight="700" fill="#00D2FF" text-anchor="middle" letter-spacing="2">GPS</text>
</svg>
